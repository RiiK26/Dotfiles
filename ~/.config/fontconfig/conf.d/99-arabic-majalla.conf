<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Sakkal Majalla</string>
    </edit>
  </match>

  <!-- Mengatur ukuran khusus untuk Sakkal Majalla -->
  <match target="font">
    <test name="family" compare="eq">
      <string>Sakkal Majalla</string>
    </test>
    <!-- Silakan ubah angka 1.5 di bawah ini sesuai selera (misal 1.2 untuk lebih kecil, atau 2.0 untuk lebih besar) -->
    <edit name="pixelsize" mode="assign">
      <times>
        <name>pixelsize</name>
        <double>2</double>
      </times>
    </edit>
    <edit name="size" mode="assign">
      <times>
        <name>size</name>
        <double>2</double>
      </times>
    </edit>
  </match>
</fontconfig>
